[workspace]
resolver = "2"
members = ["ed25519-verifier", "covenant-types", "covenant-policy", "agent-account", "pool"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
soroban-sdk = "28.0.0"
stellar-accounts = "0.8.0"
stellar-contract-utils = "0.8.0"
ed25519-dalek = "2.1.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
