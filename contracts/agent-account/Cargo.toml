[package]
name = "kovan-agent-account"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-accounts = { workspace = true }
kovan-covenant-types = { path = "../covenant-types" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
kovan-covenant-policy = { path = "../covenant-policy", features = ["testutils"] }
kovan-ed25519-verifier = { path = "../ed25519-verifier", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
