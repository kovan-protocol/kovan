name: Signer page

on:
  push:
    branches: [main]
    paths:
      - "signer/**"
      - "sdk/**"
      - "deployments/testnet.json"
      - "skills/kovan/**"
      - ".github/workflows/signer-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build SDK
        working-directory: sdk
        run: npm ci && npm run build
      - name: Test and build signer
        working-directory: signer
        run: npm ci && npm test && npm run build
      - name: Check the committed agent tool is up to date
        working-directory: signer
        run: npm run build:cli && git diff --exit-code ../skills/kovan/scripts/kovan.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: signer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
